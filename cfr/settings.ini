#!/system/bin/sh

# cfr - 配置文件

if ! command -v busybox >/dev/null 2>&1; then
  export PATH="/data/adb/magisk:/data/adb/ksu/bin:/data/adb/ap/bin:$PATH:/system/bin"
fi

# 内核路径配置
# run/ 放运行时状态（PID、crond spool、缓存），log/ 放日志（每次启动清空）
cfr_dir="/data/adb/cfr"
cfr_run="${cfr_dir}/run"
cfr_run_state="${cfr_run}/state"
cfr_log_dir="${cfr_dir}/log"

mkdir -p "${cfr_run_state}" "${cfr_log_dir}" >/dev/null 2>&1 || true

cfr_log="${cfr_log_dir}/runs.log"
cfr_pid="${cfr_run}/cfr.pid"
bin_dir="${cfr_dir}/bin"
system_packages_file="/data/system/packages.list"
uid_list="${cfr_run_state}/appuid.list"

# 基础设置
# 开机自启
boot_auto_start="true"
cfr_user_group="root:net_admin"

# 代理内核配置
bin_name="mihomo"
bin_list=("mihomo")
bin_path="${bin_dir}/${bin_name}"
bin_log="${cfr_log_dir}/${bin_name}.log"

# 启动时自动修改内核配置文件
auto_modify_config="true"

# 网络配置
# 网络模式: tun / tproxy / redirect / mixed / enhance
network_mode="tproxy"
tproxy_port="23452"
redir_port="23453"
# TUN 模式中性网卡名（仅 tun/mixed 生效，避免 meta 等强特征名称）
tun_device_name="tun0"
# TUN + bypass_cn_ip 时是否强制切换 gvisor 协议栈（false=保留 mixed/system 减少协议栈指纹差异）
tun_force_gvisor="false"
# IPv6: true=启用并走代理；false=系统级禁用 IPv6（disable_ipv6=1 + unreachable 路由）
# 没有“IPv6 可用但不走代理”的选项；停止服务时会恢复 IPv6
ipv6="false"

# 性能模式（仅 tproxy/redirect/mixed/enhance 生效，tun 模式自动忽略）
performance_mode="true"
# QUIC 处理（tun 模式不生效）：enable=放行 UDP；disable=REJECT UDP 443/80 强制回退 TCP
#   redirect/mixed：无条件阻断（该模式不代理 UDP，否则 QUIC 会绕过代理直连）
#   tproxy/enhance：需 proxy_udp="true" 才阻断
quic="disable"
# 隐匿性与防泄漏安全增强
# stealth_mode: true=本地控制器绑定 127.0.0.1 并强制随机 secret、封锁普通 App 探测本地代理端口、精简敏感日志
stealth_mode="true"
# allow_lan_controller: 是否允许控制器监听 0.0.0.0（开启时将跳过 127.0.0.1 收紧）
allow_lan_controller="false"
# protect_controller_port: true=连本机非 root App 也禁止直连控制端口（注意会拦截本机浏览器/管理器 WebUI，需用 SSH 端口转发或设 false）
protect_controller_port="false"
# block_dot: 阻断 Android 私人 DNS (TCP 853)，避免绕过透明代理 DNS 劫持与 fake-ip 分流
block_dot="true"
# kill_switch: 开机早期、启动及重启切换间隙临时阻断普通 App 外部直连，防止窗口期流量泄漏
kill_switch="true"
# tls_verify: 更新组件与拉取订阅时启用 TLS 证书校验（自动探测系统 CA 证书；仅手动设 false 时跳过）
tls_verify="true"
# upsubs_after_start: 已有 config.yaml 时优先拉起内核与代理规则后再更新订阅，避免明文直连暴露订阅特征
upsubs_after_start="true"
# DNS 走 NAT 转发（仅 tproxy/enhance 生效）：enable=REDIRECT 到 mihomo DNS；disable=走 TPROXY 劫持
mihomo_dns_forward="enable"

proxy_tcp="true"
proxy_udp="true"

dns_hijack_tcp="true"
dns_hijack_udp="true"

# DNS 劫持策略: disable / tproxy / redirect
dns_hijack_mode="tproxy"

# 绕过大陆 IP（需要设备支持 ipset）
bypass_cn_ip="false"
bypass_cn_ip_v4="false"
bypass_cn_ip_v6="false"
# CNIP 例外应用
cnip_force_proxy_apps=()
cn_ip_file="${cfr_run_state}/cn_ip.txt"
cn_ipv6_file="${cfr_run_state}/cn_ipv6.txt"
cn_ip_url="https://ispip.clang.cn/all_cn.txt"
cn_ipv6_url="https://ispip.clang.cn/all_cn_ipv6.txt"

# 热点场景 MAC 黑白名单（仅对热点/入站接口生效，默认关闭）
mac_filter="false"
mac_mode="blacklist"
macs_list=()

# 代理模式配置
# 代理模式: blacklist (黑名单) / whitelist (白名单) / core (核心模式)
proxy_mode="core"

# 订阅链接（若 config.yaml 存在 proxy-providers.airport，启动时会自动把此处链接同步过去，升级模块时也会自动继承）
subscription_url_mihomo=("https://你的订阅链接")

# 网络状态控制
# 是否根据网络状态自动控制服务（总开关）
enable_network_service_control="false"
# WiFi 连接时是否启用模块
use_module_on_wifi="true"
# WiFi 断开时是否启用模块
use_module_on_wifi_disconnect="true"
# 是否启用 WiFi 匹配（SSID/BSSID）
use_ssid_matching="false"
# SSID 匹配模式: blacklist (黑名单) / whitelist (白名单)
use_wifi_list_mode="blacklist"
# WiFi SSID 列表
wifi_ssids_list=()
# WiFi BSSID 列表
wifi_bssids_list=()
# 是否把网络状态控制决策写入 log/debug.log（默认关闭以防记录 WiFi SSID/BSSID 位置隐私）
inotify_log_enabled="false"

# 资源限制（仅 cgroup v1 设备有效，Android 11 及以下；Android 12+ 使用 v2，会自动跳过）
# 内存限制
cgroup_memcg="false"
memcg_limit="100M"
# CPU 核心分配
cgroup_cpuset="false"
allow_cpu="0-7"
# 磁盘 I/O 权重
cgroup_blkio="false"
weight=""

# 内核配置文件路径
# Mihomo 配置文件
name_mihomo_config="config.yaml"
mihomo_config="${cfr_dir}/mihomo/${name_mihomo_config}"

# 强制改写 Mihomo 配置：日志等级、IPv6 开关、dat 格式 geo 数据、内核自带 geo 自动更新
force_mihomo_key() {
  local key="$1"
  local value="$2"
  local tmp="${mihomo_config}.tmp"

  # 已是目标值时直接跳过，避免每次 source settings.ini 都触发整份文件重写与并发竞态
  if busybox grep -q "^${key}: ${value}\$" "${mihomo_config}" 2>/dev/null; then
    return 0
  fi

  if busybox grep -q "^${key}[[:space:]]*:" "${mihomo_config}" 2>/dev/null; then
    busybox sed -i "s|^${key}[[:space:]]*:.*|${key}: ${value}|" "${mihomo_config}" 2>/dev/null
    return $?
  fi

  # 插到首行：用 printf + cat 而不是 sed 的 i 命令（不同 busybox 的 i 语法差异会写坏文件）
  {
    printf '%s: %s\n' "${key}" "${value}"
    busybox cat "${mihomo_config}"
  } > "${tmp}" 2>/dev/null || { rm -f "${tmp}" 2>/dev/null; return 1; }

  # 确认真的写成了预期的一行，否则放弃改动，避免把配置写坏
  if [ "$(busybox head -n 1 "${tmp}" 2>/dev/null)" = "${key}: ${value}" ]; then
    mv -f "${tmp}" "${mihomo_config}"
  else
    rm -f "${tmp}" 2>/dev/null
    return 1
  fi
}

# 内核日志级别: silent / error / warning / info / debug（默认 error，避免大量国内 P2P/超时 warning 刷屏）
mihomo_log_level="error"

if [ -f "${mihomo_config}" ]; then
  force_mihomo_key "log-level" "${mihomo_log_level:-error}"
  # 内核的 ipv6 跟随模块开关，避免订阅里的 ipv6: true 绕过禁用
  force_mihomo_key "ipv6" "${ipv6}"
  force_mihomo_key "geodata-mode" "true"
  # 交给模块的定时任务更新，避免内核每次启动自己下载 geo
  force_mihomo_key "geo-auto-update" "false"
fi

# 自动更新配置
# 是否启用订阅自动更新（整份覆盖 config.yaml；固定配置+proxy-providers 时建议保持 false）
update_subscription="false"
# 是否启用 GeoX 数据自动更新
update_geo="true"
# 是否在定时任务中自动检查更新 mihomo 内核、面板与 curl（先比对上游版本号，无新版时跳过、不重启）
update_components="true"

# 是否启用定时任务
run_crontab="true"
# 定时任务时间（默认每天 00:00 与 12:00 各检查一次，避开常见凌晨 06:00 路由器重启窗口）
interva_update="0 0,12 * * *"

# 内核版本: enable (稳定版) / disable (预发行版)
mihomo_stable="enable"

# 代理规则配置
write_listap="${cfr_dir}/ap.list.cfg"
pkg_config="${cfr_dir}/package.list.cfg"
gid_config="${cfr_dir}/gid.list.cfg"
[ ! -f "${write_listap}" ] && touch "${write_listap}"
[ ! -f "${pkg_config}" ] && touch "${pkg_config}"
[ ! -f "${gid_config}" ] && touch "${gid_config}"

prefixed_list=($(sed -n '/^[0-9][0-9]*:/p' "${pkg_config}"))
unprefixed_list_converted=($(sed -n '/\./p' "${pkg_config}" | grep -v -E '^[0-9]+:|^[0-9]+$|^[[:space:]]*#' | sed 's/^/0:/'))
packages_list=("${prefixed_list[@]}" "${unprefixed_list_converted[@]}")
gid_list=($(busybox awk '!/^#/ && /^[0-9]+$/ {print $1}' "${gid_config}"))

ap_list=($(busybox awk '/^allow / {print $2}' "${write_listap}"))
ignore_ap_list=($(busybox awk '/^ignore / {print $2}' "${write_listap}"))

# 日志系统

append_cfr_log_line() {
  local target_file="$1"
  local target_dir
  shift
  [ -n "${target_file}" ] || return 0
  target_dir="${target_file%/*}"
  if [ "${target_dir}" != "${target_file}" ]; then
    mkdir -p "${target_dir}" >/dev/null 2>&1 || true
  fi
  printf '%s\n' "$*" >> "${target_file}" 2>/dev/null || true
}

log() {
  local normal="\033[0m"
  local red="\033[1;31m"
  local green="\033[1;32m"
  local yellow="\033[1;33m"
  local blue="\033[1;34m"
  local color
  local level="$1"
  shift
  local timestamp
  local raw_message
  local log_line
  local message

  timestamp="$(date '+%Y-%m-%d %H:%M:%S')"
  raw_message="$*"

  case "${level}" in
    Info) color="${blue}" ;;
    Error) color="${red}" ;;
    Warn|Warning) level="Warn"; color="${yellow}" ;;
    *) color="${green}" ;;
  esac

  while IFS= read -r log_line || [ -n "${log_line}" ]; do
    message="${timestamp} [${level}]: ${log_line}"
    append_cfr_log_line "${cfr_log}" "${message}"

    if [ -t 1 ]; then
      printf '%b\n' "${color}${message}${normal}"
    else
      printf '%s\n' "${message}"
    fi
  done <<EOF
${raw_message}
EOF
}
